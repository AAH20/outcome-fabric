name: Verify reference kernel

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Run synthetic case
        run: PYTHONPATH=src python -m outcome_fabric.cli fixtures/ai-support-service.json --output /tmp/outcome-fabric-receipt.json
      - name: Generate and independently verify synthetic Passport
        run: |
          PYTHONPATH=src python -m outcome_fabric.passport_cli generate fixtures/support-passport-synthetic.json --output /tmp/support-passport.json
          PYTHONPATH=src python -m outcome_fabric.passport_cli verify /tmp/support-passport.json
      - name: Reconcile synthetic exports and verify evidence package
        run: |
          PYTHONPATH=src python -m outcome_fabric.bridge_cli build fixtures/bridge/manifest.json --output /tmp/bridge-package.json
          PYTHONPATH=src python -m outcome_fabric.bridge_cli verify fixtures/bridge/manifest.json /tmp/bridge-package.json
      - name: Run and verify synthetic OutcomeBench scorecard
        run: |
          PYTHONPATH=src python -m outcome_fabric.outcomebench_cli run fixtures/bridge/manifest.json protocols/support-accepted-resolution-v1.json --output /tmp/outcomebench-scorecard.json
          PYTHONPATH=src python -m outcome_fabric.outcomebench_cli verify fixtures/bridge/manifest.json protocols/support-accepted-resolution-v1.json /tmp/outcomebench-scorecard.json
      - name: Execute local adapters and verify full OutcomeBench path
        run: |
          PYTHONPATH=src python -m outcome_fabric.simulation_cli fixtures/simulation/support-rules-40.json protocols/support-accepted-resolution-v1.json /tmp/outcomebench-simulation
          PYTHONPATH=src python -m outcome_fabric.outcomebench_cli verify /tmp/outcomebench-simulation/manifest.json protocols/support-accepted-resolution-v1.json /tmp/outcomebench-simulation/scorecard.json
      - name: Replay framework-neutral predictions without executing submitter code
        run: |
          PYTHONPATH=src python -m outcome_fabric.predictions_cli fixtures/simulation/support-rules-40.json protocols/support-accepted-resolution-v1.json fixtures/simulation/support-rules-40-predictions.json /tmp/outcomebench-replay
          PYTHONPATH=src python -m outcome_fabric.outcomebench_cli verify /tmp/outcomebench-replay/manifest.json protocols/support-accepted-resolution-v1.json /tmp/outcomebench-replay/scorecard.json
      - name: Preflight and verify private synthetic Field Lab package
        run: |
          PYTHONPATH=src python -m outcome_fabric.fieldlab_cli preflight fixtures/fieldlab/pilot.json --output /tmp/fieldlab-preflight.json
          PYTHONPATH=src python -m outcome_fabric.fieldlab_cli run fixtures/fieldlab/pilot.json --output /tmp/fieldlab-private.json
          PYTHONPATH=src python -m outcome_fabric.fieldlab_cli verify fixtures/fieldlab/pilot.json /tmp/fieldlab-private.json
      - name: Build and verify public-data finance workpaper reference
        run: |
          PYTHONPATH=src python -m outcome_fabric.finance_workpaper_cli build fixtures/finance-workpaper/case.json --output /tmp/finance-workpaper-passport.json
          PYTHONPATH=src python -m outcome_fabric.finance_workpaper_cli verify fixtures/finance-workpaper/case.json /tmp/finance-workpaper-passport.json
      - name: Run provider-neutral WorkpaperCI regression gate
        run: |
          PYTHONPATH=src python -m outcome_fabric.workpaperci_cli run fixtures/workpaperci/benchmark.json --output /tmp/workpaperci-scorecard.json
          PYTHONPATH=src python -m outcome_fabric.workpaperci_cli verify fixtures/workpaperci/benchmark.json /tmp/workpaperci-scorecard.json
          PYTHONPATH=src python -m outcome_fabric.workpaperci_cli gate fixtures/workpaperci/benchmark.json --output /tmp/workpaperci-gate.json
      - name: Recompute synthetic exact-version review ledger
        run: |
          PYTHONPATH=src python -m outcome_fabric.acceptance_ledger_cli evaluate fixtures/acceptance-ledger-config.json fixtures/acceptance-ledger/demo-events.jsonl --output /tmp/acceptance-ledger-passport.json
          PYTHONPATH=src python -m outcome_fabric.acceptance_ledger_cli verify fixtures/acceptance-ledger-config.json fixtures/acceptance-ledger/demo-events.jsonl /tmp/acceptance-ledger-passport.json
      - name: Run and verify synthetic Zendesk export intake
        run: |
          PYTHONPATH=src python -m outcome_fabric.zendesk_intake_cli run fixtures/zendesk-intake/intake.json /tmp/outcome-zendesk-intake-ci
          PYTHONPATH=src python -m outcome_fabric.zendesk_intake_cli verify fixtures/zendesk-intake/intake.json /tmp/outcome-zendesk-intake-ci
      - name: Verify public synthetic registry is reproducible
        run: |
          PYTHONPATH=src python -m outcome_fabric.registry_cli . /tmp/outcomebench-registry
          diff -u registry/RESULTS.md /tmp/outcomebench-registry/RESULTS.md
          diff -u registry/results.json /tmp/outcomebench-registry/results.json

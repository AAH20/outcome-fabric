name: Verify reference kernel

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Run synthetic case
        run: PYTHONPATH=src python -m outcome_fabric.cli fixtures/ai-support-service.json --output /tmp/outcome-fabric-receipt.json

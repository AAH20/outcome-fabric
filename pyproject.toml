[project]
name = "outcome-fabric"
version = "0.11.0"
description = "Inspectable agentic AI platform for outcome planning, AI FinOps, and governance evidence"
requires-python = ">=3.11"

[project.scripts]
outcome-fabric = "outcome_fabric.cli:main"
outcome-passport = "outcome_fabric.passport_cli:main"
outcome-bridge = "outcome_fabric.bridge_cli:main"
outcomebench = "outcome_fabric.outcomebench_cli:main"
outcomebench-simulate = "outcome_fabric.simulation_cli:main"
outcomebench-registry = "outcome_fabric.registry_cli:main"
outcomebench-replay = "outcome_fabric.predictions_cli:main"
outcomebench-fieldlab = "outcome_fabric.fieldlab_cli:main"
finance-workpaper = "outcome_fabric.finance_workpaper_cli:main"
workpaperci = "outcome_fabric.workpaperci_cli:main"
acceptance-ledger = "outcome_fabric.acceptance_ledger_cli:main"
outcome-zendesk-intake = "outcome_fabric.zendesk_intake_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
